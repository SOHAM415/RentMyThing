services:
  postgres:
    image: postgres:16-alpine
    container_name: rentmything-postgres
    environment:
      POSTGRES_DB: rentmything
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentmything"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: rentmything-backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: rentmything
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: rentmything-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
